[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = ["crates/kb-core", "crates/hiring-core", "crates/relay-protocol"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
rusqlite = "0.31.0"
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
reqwest = { version = "0.12.9", features = ["json", "rustls-tls"] }
dotenvy = "0.15.7"
tauri-plugin-shell = "2.3.5"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
keyring = "3"
kb-core = { path = "crates/kb-core" }
hiring-core = { path = "crates/hiring-core" }
relay-protocol = { path = "crates/relay-protocol" }
