[package]
name = "hiring-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# bundled: windows-gnu has no libsqlite3 to link against, so build SQLite
# from source for tests only.
rusqlite = { version = "0.31", features = ["bundled"] }
